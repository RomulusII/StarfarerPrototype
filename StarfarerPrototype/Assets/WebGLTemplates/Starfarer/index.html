<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover">
    <!-- iPhone'da TAM EKRANIN TEK YOLU ana ekrana eklemek. Safari iPhone'da
         Fullscreen API'sini yalnızca <video> için açar; tuvali tam ekrana
         almak mümkün değil (iPad'de mümkün). Ana ekrandan açılan sayfa ise
         adres ve araç çubuğu olmadan, uygulama gibi açılır — bu meta'lar onu
         ister. viewport-fit=cover çentiğin yanını da oyuna verir. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="{{{ PRODUCT_NAME }}}">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      /* Oyun landscape ve kadrajını kendi hesaplıyor (bkz. CameraController,
         ViewBounds); tarayıcıda yapılacak doğru şey pencerenin TAMAMINI ona
         vermek. Unity'nin Default şablonu sabit boyutlu bir kutu çizer ve
         telefonda oyun ekranın ortasında küçük bir kare olarak kalır. */
      /* YÜKSEKLİK: dvh, vh DEĞİL.
         Mobil tarayıcıda `height: 100%` (ve 100vh) adres çubuğunun kapladığı
         yeri SAYMAYAN düzen yüksekliğine göre çözülür. Sonuç: tuval görünen
         alandan uzun olur, sayfa kayar ve sağ alttaki tam ekran düğmesi
         ekranın dışında kalır — yani tam ekrana geçerek kurtulmak da mümkün
         olmaz. `dvh` görünen alanı takip eder ve çubuk gizlenip göründükçe
         güncellenir. Destek yoksa üstteki 100% devrede kalır. */
      html, body {
        margin: 0; padding: 0; border: 0;
        width: 100%; height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #05070c;
      }
      #unity-canvas {
        display: block;
        width: 100%; height: 100%;
        height: 100dvh;
        position: fixed; inset: 0;
        /* Dokunma sürüklemesi sayfayı kaydırmasın: parmak oyunun nişan
           girdisidir (bkz. PointerInput), tarayıcının scroll'u değil. */
        touch-action: none;
      }
      #loader {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 18px;
        color: #8ea6c4;
        font: 600 14px/1.4 system-ui, -apple-system, Segoe UI, sans-serif;
        letter-spacing: .18em;
        background: #05070c;
      }
      #bar { width: min(320px, 60vw); height: 3px; background: #17202e; }
      #fill { width: 0; height: 100%; background: #4f7fb8; transition: width .15s linear; }
      #ver {
        font: 600 11px/1 system-ui, -apple-system, Segoe UI, sans-serif;
        letter-spacing: .12em;
        color: #3a4655;
      }
      /* Boyutlar bir tur %50 büyütüldü ve köşeden İÇERİ çekildi (12 → 28 px):
         birçok telefonda ekranın en kenarındaki dokunuşlar kaçıyor. */
      #fs, #apk {
        position: fixed; bottom: 28px;
        height: 51px;
        display: none;
        border: 0; border-radius: 6px;
        background: rgba(20, 28, 40, .72); color: #cfe0f2;
        font-size: 26px; line-height: 51px; cursor: pointer;
      }
      #fs  { right: 28px; width: 51px; }
      #apk {
        right: 87px; padding: 0 15px;
        font: 600 18px/51px system-ui, -apple-system, Segoe UI, sans-serif;
        letter-spacing: .08em; text-decoration: none;
      }
      #fs:hover, #apk:hover { background: rgba(32, 44, 62, .9); }

      /* Dokunmatikte düğmeler büyür. Fare boyutu parmak için yetmez — ve
         bunlardan biri tam ekran, yani dar ekranda oyunun kaçış yolu.
         Ulaşılamayan bir kaçış yolu, olmayanla aynı şey. */
      @media (pointer: coarse) {
        #fs, #apk { height: 69px; bottom: 36px; }
        #fs  { right: 36px; width: 69px; font-size: 33px; line-height: 69px; }
        #apk { right: 115px; line-height: 69px; font-size: 20px; }
      }

      /* Çentikli telefonlarda (viewport-fit=cover) düğmeler ev çubuğunun ve
         yuvarlak köşenin altında kalmasın. */
      @supports (bottom: env(safe-area-inset-bottom)) {
        #fs, #apk { bottom: calc(28px + env(safe-area-inset-bottom)); }
        #fs { right: calc(28px + env(safe-area-inset-right)); }
        @media (pointer: coarse) {
          #fs, #apk { bottom: calc(36px + env(safe-area-inset-bottom)); }
          #fs { right: calc(36px + env(safe-area-inset-right)); }
        }
      }

      /* iPhone'da tam ekran düğmesi "Ana Ekrana Ekle" talimatını açar. */
      #ioshint {
        position: fixed; inset: 0;
        display: none; align-items: center; justify-content: center;
        background: rgba(5, 7, 12, .82);
        z-index: 10;
      }
      #ioshint > div {
        max-width: min(420px, 86vw);
        padding: 22px 24px;
        border-radius: 10px;
        background: #121a26; color: #cfe0f2;
        font: 500 17px/1.5 system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      #ioshint b { color: #fff; }
      #ioshint .ico { font-size: 26px; vertical-align: -3px; }

      /* PORTREYİ ENGELLEYEN KAPLAMA KALDIRILDI — ve neden, kalıcı bir ders:
         oyun landscape diye portrede ekranı kapatan bir uyarı koyduk. Sonuç,
         çözmeye çalıştığından kötü oldu. Yatayda tuval görünen alandan uzun
         olduğu için tam ekran düğmesi ekran dışında kalıyordu; oyuncu düğmeye
         ulaşmak için telefonu dikey çevirdiğinde ise karşısına oyunu tamamen
         kapatan uyarı çıkıyordu. Yani her iki yönelimde de sıkışıyordu.

         Bir uyarının kabul edilebilir olması için oyuncunun ondan ÇIKIŞ YOLU
         olmalı; burada çıkış yolunun kendisi uyarının arkasında kalıyordu.
         Yatay kilit artık yalnızca tam ekranda, gerçek Screen Orientation API
         ile deneniyor — orada kilit gerçek ve çıkışı da tarayıcının kendi
         jesti. Portrede oyun oynanır, sadece dar olur. */
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1" style="background: {{{ BACKGROUND_FILENAME ? 'url(\'Build/' + BACKGROUND_FILENAME.replace(/'/g, '%27') + '\') center / cover' : BACKGROUND_COLOR }}}"></canvas>

    <!-- Yükleme göstergesi kasten METİNSİZ: bu sayfa oyunun dil katmanının
         (Loc) dışında kalır, yazı koyulsaydı üç dilde ayrıca tutulması
         gerekirdi. Çubuk her dilde aynı şeyi anlatıyor. -->
    <!-- Sürüm numarası yükleme ekranında da durur: oyun HİÇ açılmazsa menüye
         (StartMenuUI) ulaşılamaz ve testçi hangi paketi denediğini söyleyemez —
         oysa "açılmıyor" bildiriminin en kritik alanı tam olarak budur.

         Yükleyicinin metinsiz olma kuralını bozmuyor: bu sayfa Loc katmanının
         dışında ve buradaki şey sayı, üç dilde de aynı okunuyor.

         Denge revizyonu burada YOK — şablon makroları yalnızca Unity'nin paket
         sürümünü verir, GameVersion'a erişemez. Menüdeki satır ikisini birden
         gösteriyor. -->
    <div id="loader">
      <div>{{{ PRODUCT_NAME }}}</div>
      <div id="bar"><div id="fill"></div></div>
      <div id="ver">{{{ PRODUCT_VERSION }}}</div>
    </div>

    <!-- Android paketi. Etiket kasten dilden bağımsız ("APK" üç dilde de aynı):
         bu sayfa oyunun Loc katmanının dışında.

         Oyunun Unity arayüzü yerine sayfada durmasının sebebi: WebGL'de
         Application.OpenURL window.open'a düşer ve tarayıcı bunu açılır pencere
         sayılıp engelleyebilir; gerçek bir <a download> her zaman çalışır.
         Ayrıca oyun koduna platform kontrolü girmiyor — bu düğme yalnızca
         tarayıcı sürümünde VAR OLUYOR.

         Paket oyunla AYNI klasörde durur. Bir üstte tutulup oraya ayrı bir
         web.config konması denendi ve çalışmadı: IIS yapılandırması bulunduğu
         klasör ve altı için geçerli, üste doğru işlemiyor. Aynı klasör, build
         ile birlikte giden tek bir MIME eşlemesiyle çözüyor.

         Dosya yoksa link hiç görünmez (aşağıdaki HEAD yoklaması). -->
    <a id="apk" href="Starfarer.apk" download>&#8681; APK</a>

    <button id="fs" title="Tam ekran">&#9974;</button>

    <div id="ioshint"><div id="ioshinttext"></div></div>


    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loader = document.querySelector("#loader");
      var fill   = document.querySelector("#fill");
      var bar    = document.querySelector("#bar");
      var fs     = document.querySelector("#fs");
      var apk    = document.querySelector("#apk");

      // Paket sunucuda gerçekten duruyor mu? Yoksa link hiç gösterilmez —
      // tıklayınca 404 veren bir düğme, olmayan düğmeden kötüdür.
      var apkVar = false;

      // DÜĞMELER YALNIZCA MENÜDE VE UPGRADE EKRANINDA GÖRÜNÜR. Oyun sırasında
      // sağ alt köşe dövüş alanıdır: düğmeler oradaki düşmanın üstünü
      // örtüyor, telefonda nişan alan parmak yanlışlıkla tam ekrana ya da APK
      // indirmeye basıyordu. Hangi ekranın açık olduğunu yalnızca oyun bilir;
      // Unity bunu WebChrome.jslib üzerinden bildirir (bkz. WebChrome.cs).
      //
      // Üç koşulun VE'si: oyun yüklendi, oyun "göster" dedi, (APK için) paket
      // var. Üçü farklı anlarda gelir — menü ilk karelerde açılır ve bildirimi
      // createUnityInstance'ın then'inden ÖNCE gelebilir, HEAD yoklaması ise
      // herhangi bir anda döner. Bu yüzden her biri yalnızca kendi durumunu
      // yazar ve görünürlük tek yerden uygulanır.
      var unityReady = false, gameWantsChrome = false;
      // iOS: iPhone'da tuval tam ekrana alınamaz (Fullscreen API yalnızca
      // <video> için). iPad'de webkit önekiyle çalışır. iPadOS 13+ kendini
      // masaüstü Mac olarak tanıttığı için dokunma noktası sayısıyla ayrılır.
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      var fsSupported = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
      // Ana ekrandan açıldıysa zaten tarayıcı çubuğu yok: düğmenin işi kalmadı.
      var standalone = window.navigator.standalone === true ||
                       (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
                       (window.matchMedia && window.matchMedia("(display-mode: fullscreen)").matches);
      var fsUseful = !standalone && (fsSupported || isIOS);

      function applyChrome() {
        var show = unityReady && gameWantsChrome;
        fs.style.display  = show && fsUseful ? "block" : "none";
        // APK yalnızca Android'de kurulur — iPhone'da indirme düğmesi yalan söyler.
        apk.style.display = show && apkVar && !isIOS ? "block" : "none";
      }

      // Talimat metni sayfa dilinden: bu sayfa oyunun Loc katmanının dışında.
      var share = "<span class='ico'>&#x2B06;&#xFE0E;</span>";
      var hintText = {
        tr: "iPhone'da tarayıcı oyunu tam ekrana alamıyor.<br><br>" +
            "Alttaki <b>Paylaş</b> " + share + " düğmesine bas, ardından " +
            "<b>Ana Ekrana Ekle</b>'yi seç. Oyunu ana ekrandaki simgeden açınca " +
            "tarayıcı çubukları olmadan, tam ekran açılır.",
        de: "Auf dem iPhone kann der Browser das Spiel nicht im Vollbild zeigen.<br><br>" +
            "Tippe unten auf <b>Teilen</b> " + share + " und wähle " +
            "<b>Zum Home-Bildschirm</b>. Über das Symbol gestartet, läuft das Spiel " +
            "ohne Browserleisten im Vollbild.",
        en: "On iPhone the browser can't show the game full screen.<br><br>" +
            "Tap <b>Share</b> " + share + " at the bottom, then " +
            "<b>Add to Home Screen</b>. Launched from that icon, the game runs " +
            "full screen without the browser bars."
      };
      var lang = (navigator.language || "en").slice(0, 2).toLowerCase();
      var ioshint = document.querySelector("#ioshint");
      document.querySelector("#ioshinttext").innerHTML = hintText[lang] || hintText.en;
      ioshint.onclick = function () { ioshint.style.display = "none"; };
      window.starfarerSetChrome = function (visible) {
        gameWantsChrome = !!visible;
        applyChrome();
      };

      fetch(apk.getAttribute("href"), { method: "HEAD" })
        .then(function (r) { apkVar = r.ok; applyChrome(); })
        .catch(function () { apkVar = false; applyChrome(); });

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        // Denge kaydı tarayıcıda IndexedDB'ye yazılır. Unity'nin eski elle
        // senkronizasyonu kullanımdan kalkıyor ve konsolda uyarı veriyordu;
        // bu bayrak dosya her değiştiğinde otomatik senkronu açar. Kaydın
        // diske gerçekten inmesi telemetrinin tamamının ön koşulu.
        autoSyncPersistentDataPath: true,
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }, function (progress) {
        fill.style.width = (100 * progress) + "%";
      }).then(function (unityInstance) {
        loader.style.display = "none";
        unityReady = true;
        applyChrome();

        // "Tam ekrandan çıkmak için aşağı kaydırın" bildirimi TARAYICININDIR,
        // sayfanın değil: süresi buradan kısaltılamaz, gizlenemez. Tam ekranı
        // taklit eden bir sayfanın kullanıcıyı kandırmasını önleyen bir
        // güvenlik arayüzüdür ve bilerek sayfanın erişimi dışında tutulur.
        // Onu hiç görmemenin tek yolu Fullscreen API'sini hiç kullanmamak:
        // APK, ya da ana ekrana eklenmiş (display: fullscreen) bir web
        // uygulaması.
        fs.onclick = function () {
          if (!fsSupported) { ioshint.style.display = "flex"; return; }
          unityInstance.SetFullscreen(1);
          // Yönelim kilidi YALNIZCA tam ekranda çalışır (tarayıcı kuralı) ve
          // masaüstünde hiç desteklenmez. Başarısızlığı yutuyoruz: kilit bir
          // iyileştirme, ön koşul değil — tutmazsa portredeki kaplama devrede.
          // Tam ekran geçişi bir kare sürebildiği için küçük bir gecikme var.
          setTimeout(function () {
            var o = screen.orientation;
            if (o && o.lock) { try { o.lock("landscape").catch(function () {}); } catch (e) {} }
          }, 250);
        };
      }).catch(function (message) {
        // Hata metni çubuğun YERİNE geçer ama sürüm satırı KALIR: "oyun
        // açılmıyor" bildiriminin işe yaraması için hangi paketin açılmadığını
        // bilmek gerekiyor. innerHTML'i topluca ezmek tam da o bilgiyi
        // siliyordu.
        bar.outerHTML = "<div style='color:#c46a6a;max-width:80vw;text-align:center'>" +
                        String(message) + "</div>";
      });
    </script>
  </body>
</html>
